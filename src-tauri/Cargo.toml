[package]
name = "maxplus"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maxplus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rumax = { path = "../../rumax" }
tauri = { version = "2.11.2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-android-fs = "29.0.0"
tauri-plugin-stronghold = "2.3.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-http = "2.6.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-upload = "2.4.1"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-os = "2.3.2"
tokio = { version = "1", features = ["full"] }
regex = "1.11.3"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }
futures-util = "0.3.31"
webpki-roots = "1.0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "blocking"] }
rmp-serde = "1.3.0"
openssl = { version = "0.10", features = ["vendored"] }
urlencoding = "2.1"
tiny_http = "0.12.0"
dirs = "6.0.0"
mime_guess = "2.0.5"
base64 = "0.22.1"
keyring = "3"
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
chrono = "0.4.45"
chacha20poly1305 = "0.11.0"
walkdir = "2.5.0"
sha2 = "0.11.0"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true


[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2.4.6"
tauri-plugin-biometric = "2.3.3"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-safe-area-insets-css = "0.2"
tauri-plugin-ios-webview-insets = "0.1"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Max+</title>
    %sveltekit.head%
    <script>
      (function(){try{var t=localStorage.getItem('maxplus-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
    </script>
<style>
      :root {
        --safe-top: 24px;
        --safe-bottom: 0px;
        --bg-app: #ffffff;
        --bg-chat: #edeef2;
        --bg-surface: #f5f7fa;
        --bg-surface-2: #e9ebf1;
        --bg-sheet: #ffffff;
        --bg-panel: #f5f7fa;
        --bg-topbar: #ffffff;
        --accent-primary: #007aff;
        --accent-primary-hover: #006ee5;
        --accent-subtle: rgba(0, 122, 255, 0.12);
        --accent-subtle-hover: rgba(0, 122, 255, 0.2);
        --bubble-outgoing: #d9f7be;
        --bubble-incoming: #ffffff;
        --text-primary: #060708;
        --text-secondary: #3c4043;
        --text-muted: #6b7280;
        --text-subtle: #9da4ac;
        --border-subtle: rgba(12, 13, 14, 0.08);
        --border-card: rgba(12, 13, 14, 0.06);
        --status-success: #1abe43;
        --status-danger: #ff303c;
        --status-warning: #fc0;
        --badge-unread: #007aff;
        --read-tick: #007aff;
        --online: #1abe43;
      }

      [data-theme="dark"] {
        --bg-app: #17181c;
        --bg-chat: #161621;
        --bg-surface: #1e2025;
        --bg-surface-2: #26262e;
        --bg-sheet: #1e1f24;
        --bg-panel: #1c1d1f;
        --bg-topbar: #212126;
        --accent-primary: #248bfe;
        --accent-primary-hover: #1b74d9;
        --accent-subtle: rgba(36, 139, 254, 0.12);
        --accent-subtle-hover: rgba(36, 139, 254, 0.2);
        --bubble-outgoing: #7b4cd6;
        --bubble-incoming: #3a3c55;
        --text-primary: #ffffff;
        --text-secondary: #edf0f5;
        --text-muted: #8b929e;
        --text-subtle: #697282;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-card: rgba(255, 255, 255, 0.06);
        --status-success: #4ade80;
        --status-danger: #ef4444;
        --status-warning: #fbbf24;
        --badge-unread: #3b82f6;
        --read-tick: #34b7f1;
        --online: #4fc3f7;
      }

      body {
        margin: 0;
        background-color: var(--bg-app);
        overflow: hidden;
      }

      #app {
        display: contents;
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: var(--bg-app);
        z-index: 99999;
        user-select: none;
        -webkit-user-select: none;
        transition: opacity 0.25s ease-out, visibility 0.25s ease-out;
      }

      .initial-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .initial-loader.loaded .loader-dots span {
        animation-play-state: paused;
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .loader-icon-wrapper {
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loader-icon {
        width: 100%;
        height: 100%;
      }

      .loader-title {
        color: var(--text-primary);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        font-family: system-ui, sans-serif;
      }

      .loader-dots {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }

      .loader-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-primary);
        animation: pulse-dot 1.2s infinite ease-in-out;
      }

      .loader-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loader-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      .loader-credits {
        position: absolute;
        bottom: max(24px, env(safe-area-inset-bottom, 24px));
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .credits-text {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 400;
        letter-spacing: 0.2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 90%;
        font-family: system-ui, sans-serif;
      }

      @keyframes pulse-dot {
        0%, 80%, 100% {
          opacity: 0.2;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="initial-loader" class="initial-loader">
      <div class="loader-content">
        <div class="loader-icon-wrapper">
          <svg class="loader-icon" viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(54 54) scale(0.68) translate(-54 -54)">
              <path
                d="M54,28.7733C68.1126,28.7733 79.5,40.1581 79.5,54.1365C79.5,68.115 68.1126,79.4998 54,79.4998C39.8874,79.4998 28.5,68.115 28.5,54.1365C28.5,40.1581 39.8874,28.7733 54,28.7733Z"
                fill="none"
                stroke="var(--text-primary)"
                stroke-width="15"
              />
              <path
                d="M22.3915,55.3724C22.3915,55.3724 22.2564,47.3297 25.3431,39.0233C28.4297,30.717 27.7587,23.2017 29.3691,21.6194C30.9795,20.0372 38.9522,21.5956 42.7906,25.0474L22.3915,55.3724Z"
                fill="var(--text-primary)"
                stroke="var(--text-primary)"
                stroke-width="1"
              />
              <path
                d="M85.691,56.0431C85.691,56.0431 85.825,47.8434 82.7643,39.375C79.7036,30.9066 80.369,23.2446 78.7721,21.6315C77.1752,20.0184 69.2695,21.6072 65.4633,25.1264L85.691,56.0431Z"
                fill="var(--text-primary)"
                stroke="var(--text-primary)"
                stroke-width="1"
              />
            </g>
          </svg>
        </div>
        <div class="loader-title">Max+</div>
        <div class="loader-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
      <div class="loader-credits">
        <span id="initial-credits-text" class="credits-text"></span>
      </div>
    </div>
    <div id="app">%sveltekit.body%</div>
    <script>
      (async () => {
        try {
          let list = [
            ["contributor", "JuniorAww", "Разработал", 5],
            ["contributor", "hu553in", "Адаптировал", 5],
            ["contributor", "megazoll", "Улучшил", 1]
          ];

          const invoke = window.__TAURI_INTERNALS__?.invoke || window.__TAURI__?.core?.invoke;
          if (invoke) {
            const disk = await invoke("common_store_load", { store: "credits_cache" }).catch(() => null);
            if (Array.isArray(disk) && disk.length) list = disk;
          }

          const getW = x => Math.max(1, +(x?.[3] ?? x?.p) || 1);
          let rnd = Math.random() * list.reduce((sum, item) => sum + getW(item), 0);
          const chosen = list.find(item => (rnd -= getW(item)) < 0) || list.at(-1);

          const name = chosen?.[1] ?? chosen?.name ?? "";
          const text = chosen?.[2] ?? chosen?.text ?? "";
          const str = [text, name].filter(Boolean).join(" ");

          const el = document.getElementById("initial-credits-text");
          if (el && str) el.textContent = str;
        } catch {}
      })();
    </script>
  </body>
</html>

name: Build Max+ Windows

on:
  workflow_dispatch:
    inputs:
      rumax_branch:
        description: "Branch of rumax to use"
        required: false
        default: "dev"
      biometry_branch:
        description: "Branch of tauri-plugin-biometry to use"
        required: false
        default: "main"

jobs:
  build:
    runs-on: windows-latest
    env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Patch Cargo.toml for CI
        run: |
          $branch = "${{ github.event.inputs.rumax_branch || 'dev' }}"
          $biometry_branch = "${{ github.event.inputs.biometry_branch || 'main' }}"
          (Get-Content src-tauri/Cargo.toml) -replace 'path = "\.\./\.\./rumax"', "git = `"https://github.com/junioraww/rumax.git`", branch = `"$branch`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content src-tauri/Cargo.toml) -replace 'path = "\.\./\.\./tauri-plugin-biometry"', "git = `"https://github.com/junioraww/tauri-plugin-biometry.git`", branch = `"$biometry_branch`"" | Set-Content src-tauri/Cargo.toml
          (Get-Content src-tauri/Cargo.toml) | Where-Object { $_ -notmatch 'libwebrtc' } | Set-Content src-tauri/Cargo.toml
          Select-String -Path src-tauri/Cargo.toml -Pattern "rumax|tauri-plugin-biometry"

      - run: bun install --frozen-lockfile

      - run: bun run tauri icon static/favicon.png

      - run: |
          $confPath = (Resolve-Path "src-tauri/tauri.conf.json").Path
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          if ($conf.version -match '-') {
            $conf.bundle.targets = @("nsis")
            [System.IO.File]::WriteAllText($confPath, ($conf | ConvertTo-Json -Depth 20))
            bunx tauri build --bundles nsis
          } else {
            bunx tauri build
          }

      - uses: actions/upload-artifact@v6
        with:
            name: maxplus-windows
            path: |
              src-tauri/target/release/*.exe
              src-tauri/target/release/bundle/**/*.exe
              src-tauri/target/release/bundle/**/*.msi

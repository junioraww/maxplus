name: Build Max+ Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK PATH
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDK_BIN=$(dirname $(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1))
          echo "$SDK_BIN" >> $GITHUB_PATH
          echo "$SDK_DIR/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.3.13750724"

      - name: Configure Android NDK
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK="$SDK_DIR/ndk/27.3.13750724"
          echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch Tauri identifier and Android path
        run: |
          sed -i 's|"identifier": "org.meowkie.max"|"identifier": "ru.oneme.app"|g' src-tauri/tauri.conf.json
          sed -i 's|org.meowkie.max|ru.oneme.app|g' src-tauri/gen/android/app/build.gradle.kts
          sed -i 's|org_meowkie_max|ru_oneme_app|g' src-tauri/src/notifications.rs
          sed -i 's|org/meowkie/max|ru/oneme/app|g' src-tauri/src/notifications.rs
          sed -i 's|org.meowkie.max|ru.oneme.app|g' src-tauri/gen/android/app/src/main/AndroidManifest.xml

          echo "Tauri conf updated:"
          grep identifier src-tauri/tauri.conf.json

          mkdir -p src-tauri/gen/android/app/src/main/java/ru/oneme
          mv src-tauri/gen/android/app/src/main/java/org/meowkie/max src-tauri/gen/android/app/src/main/java/ru/oneme/app
          rm -rf src-tauri/gen/android/app/src/main/java/org/meowkie
          find src-tauri/gen/android/app/src/main/java/ru/oneme/app -name "*.kt" -type f -exec sed -i 's|org.meowkie.max|ru.oneme.app|g' {} +

          mkdir -p src-tauri/gen/android/buildSrc/src/main/java/ru/oneme
          mv src-tauri/gen/android/buildSrc/src/main/java/org/meowkie/max src-tauri/gen/android/buildSrc/src/main/java/ru/oneme/app 2>/dev/null || true
          rm -rf src-tauri/gen/android/buildSrc/src/main/java/org/meowkie 2>/dev/null || true
          find src-tauri/gen/android/buildSrc/src/main/java/ru/oneme/app -name "*.kt" -type f -exec sed -i 's|org.meowkie.max|ru.oneme.app|g' {} + 2>/dev/null || true

      - name: Init Tauri Android
        run: |
          bunx tauri android init
          rm -f src-tauri/gen/android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml
          rm -rf src-tauri/gen/android/buildSrc/src/main/java/org/meowkie 2>/dev/null || true
          rm -rf src-tauri/gen/android/app/src/main/java/org/meowkie 2>/dev/null || true

      - name: Generate Bundle Icons
        run: |
          bun run tauri icon static/favicon.png
          git checkout -- src-tauri/gen/android/app/src/main/res/mipmap-anydpi-v26/
          rm -f src-tauri/gen/android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f src-tauri/gen/android/app/src/main/res/values/ic_launcher_background.xml
          rm -rf src-tauri/gen/android/buildSrc/src/main/java/org/meowkie 2>/dev/null || true
          rm -rf src-tauri/gen/android/app/src/main/java/org/meowkie 2>/dev/null || true

      - name: Patch Cargo.toml for CI
        run: |
          sed -i 's|path = "../../rumax"|git = "https://github.com/me0wkie/rumax.git", branch = "main"|g' src-tauri/Cargo.toml

          echo "Cargo.toml updated:"
          grep rumax src-tauri/Cargo.toml

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build Multi Android
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bunx tauri android build --apk --split-per-abi

      - name: Build Universal Android
        env:
          ANDROID_KEYSTORE: ${{ github.workspace }}/release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bunx tauri android build --apk

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: maxplus-android-arm64
          path: |
            src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: maxplus-android-arm
          path: |
            src-tauri/gen/android/app/build/outputs/apk/arm/release/*.apk

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: x86-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/x86/release/*.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/x86_64/release/*.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-apk
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk

name: Publish Release to Web

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.8)'
        required: true
        type: string
      name:
        description: 'Release Title'
        required: false
        type: string
      body:
        description: 'Release Notes / Changelog'
        required: false
        type: string
      download_run_id:
        description: 'Optional comma-separated Run ID(s) to download from manually instead of auto-discovery'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      CI_ENDPOINT: ${{ vars.SITE_CI_ENDPOINT || secrets.SITE_CI_ENDPOINT || vars.SITE_CI_URL || secrets.SITE_CI_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag_name }}
      TITLE: ${{ inputs.name || format('MaxPlus {0}', inputs.tag_name) }}
      NOTES: ${{ inputs.body || 'Production release update' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Version Match
        run: |
          TAURI_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${TAG#v}" != "${TAURI_VERSION#v}" ]; then
            echo "::warning::Release tag ($TAG) does not exactly match tauri.conf.json ($TAURI_VERSION). Continuing."
          fi

      - name: Download Artifacts
        run: |
          mkdir -p raw_artifacts release_assets
          TARGET_VERSION="${TAG#v}"

          if [ -n "${{ inputs.download_run_id }}" ]; then
            echo "Downloading explicitly specified Run IDs..."
            for run_id in $(echo "${{ inputs.download_run_id }}" | tr ',' ' '); do
              gh run download "$run_id" --dir raw_artifacts || true
            done
          else
            echo "Auto-discovering latest successful workflow artifacts matching ${TAG}..."
            WORKFLOWS=(
              "Build Pipeline"
              "Build Max+ Android"
              "Build Max+ Windows"
              "Build Max+ macOS"
              "Build Max+ iOS"
              "Build Max+ Linux"
            )

            for wf in "${WORKFLOWS[@]}"; do
              RUN_INFO=$(gh run list --workflow "$wf" --status success --limit 1 --json databaseId,headSha -q '.[0]' 2>/dev/null || echo "")
              RUN_ID=$(echo "$RUN_INFO" | jq -r '.databaseId // empty' 2>/dev/null || echo "")
              HEAD_SHA=$(echo "$RUN_INFO" | jq -r '.headSha // empty' 2>/dev/null || echo "")

              if [ -z "$RUN_ID" ]; then
                echo "No successful run found for $wf"
                continue
              fi

              RUN_VER=$(gh api "repos/$GITHUB_REPOSITORY/contents/src-tauri/tauri.conf.json?ref=$HEAD_SHA" -q '.content | @base64d | fromjson | .version' 2>/dev/null || echo "")
              if [ -n "$RUN_VER" ] && [ "${RUN_VER#v}" != "$TARGET_VERSION" ]; then
                echo "Skipping $wf: build version ($RUN_VER) does not match target ($TARGET_VERSION)"
                continue
              fi

              echo "Downloading $wf (run $RUN_ID, version $RUN_VER)..."
              gh run download "$RUN_ID" --dir raw_artifacts || true
            done
          fi

          shopt -s globstar nullglob
          for file in raw_artifacts/**/*; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            case "$file" in
              *fcm*/*.apk|*FCM*/*.apk)
                cp "$file" "release_assets/maxplus-fcm-arm64-${TARGET_VERSION}.apk"
                ;;
              *maxplus-android-arm64*/*.apk)
                cp "$file" "release_assets/maxplus-arm64-${TARGET_VERSION}.apk"
                ;;
              *maxplus-android-arm*/*.apk)
                cp "$file" "release_assets/maxplus-arm-${TARGET_VERSION}.apk"
                ;;
              *universal*/*.apk)
                cp "$file" "release_assets/maxplus-universal-${TARGET_VERSION}.apk"
                ;;
              *maxplus-ios*/*.ipa)
                cp "$file" "release_assets/maxplus-ios-${TARGET_VERSION}.ipa"
                ;;
              *maxplus-windows*/*.exe)
                cp "$file" "release_assets/maxplus-windows-${TARGET_VERSION}.exe"
                ;;
              *maxplus-windows*/*.msi)
                cp "$file" "release_assets/maxplus-windows-${TARGET_VERSION}.msi"
                ;;
              *maxplus-linux*/*.deb)
                cp "$file" "release_assets/maxplus-linux-${TARGET_VERSION}.deb"
                ;;
              *maxplus-linux*/*lite*.AppImage)
                cp "$file" "release_assets/maxplus-linux-${TARGET_VERSION}-lite.AppImage"
                ;;
              *maxplus-linux*/*.AppImage)
                cp "$file" "release_assets/maxplus-linux-${TARGET_VERSION}.AppImage"
                ;;
              *maxplus-macos*/*.dmg)
                cp "$file" "release_assets/maxplus-macos-${TARGET_VERSION}.dmg"
                ;;
            esac
          done

          if [ -z "$(ls -A release_assets)" ]; then
            echo "::error::No build artifacts found to publish!"
            exit 1
          fi

          echo "Prepared assets for release:"
          ls -lh release_assets

      - name: Publish Release to Web
        env:
          CI_SECRET: ${{ secrets.SITE_CI_SECRET }}
        run: |
          echo "Initializing release tag: $TAG ($TITLE)"
          curl -sS --fail-with-body -X POST "$CI_ENDPOINT" \
            -H "X-CI-Secret: $CI_SECRET" \
            -F "tag_name=$TAG" \
            -F "name=$TITLE" \
            -F "body=$NOTES"

          for file in release_assets/*; do
            if [ -f "$file" ]; then
              echo "Uploading $(basename "$file") ($(du -h "$file" | cut -f1))..."
              curl -sS --fail-with-body -X POST "$CI_ENDPOINT" \
                -H "X-CI-Secret: $CI_SECRET" \
                -F "tag_name=$TAG" \
                -F "name=$TITLE" \
                -F "files=@$file"
            fi
          done

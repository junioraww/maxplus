name: Build Max+ Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-alsa \
            gstreamer1.0-gl

      - name: Install Clang 21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21 all
          echo "CC=clang-21" >> $GITHUB_ENV
          echo "CXX=clang++-21" >> $GITHUB_ENV

      - name: Patch Cargo.toml for CI
        run: |
          sed -i 's|path = "../../rumax"|git = "https://github.com/junioraww/rumax.git", branch = "main"|g' src-tauri/Cargo.toml

          echo "Cargo.toml updated:"
          grep rumax src-tauri/Cargo.toml

      - run: bun install --frozen-lockfile

      - run: bun run tauri icon static/favicon.png

      - run: |
          echo "WEBKIT_DISABLE_COMPOSITING_MODE=1" >> $GITHUB_ENV
          echo "GDK_BACKEND=x11" >> $GITHUB_ENV
          echo "WEBKIT_DISABLE_DMABUF_RENDERER=1" >> $GITHUB_ENV

      - run: bunx tauri build

      - name: Build Lite AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          for f in src-tauri/target/release/bundle/appimage/MAX_*; do
            [ -f "$f" ] && mv "$f" "${f//MAX_/maxplus_}"
          done
          for f in src-tauri/target/release/bundle/deb/MAX_*; do
            [ -f "$f" ] && mv "$f" "${f//MAX_/maxplus_}"
          done
          ORIGINAL_APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          LITE_APPIMAGE="${ORIGINAL_APPIMAGE%.AppImage}-lite.AppImage"
          $ORIGINAL_APPIMAGE --appimage-extract
          rm -rf squashfs-root/usr/lib
          mkdir -p squashfs-root/usr/lib
          printf '%s\n' \
            '#!/bin/sh' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'export APPDIR="$HERE"' \
            'export XDG_DATA_DIRS="${HERE}/usr/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}"' \
            'unset GST_PLUGIN_SYSTEM_PATH_1_0' \
            'unset GST_PLUGIN_PATH_1_0' \
            'unset GST_PLUGIN_SCANNER' \
            'exec "${HERE}/usr/bin/maxplus" "$@"' > squashfs-root/AppRun
          chmod +x squashfs-root/AppRun
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$LITE_APPIMAGE"
          rm -rf squashfs-root appimagetool

      - uses: actions/upload-artifact@v4
        with:
          name: maxplus-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

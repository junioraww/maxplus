name: Build Max+ iOS

on:
  workflow_dispatch:
    inputs:
      rumax_branch:
        description: "Branch of rumax to use"
        required: false
        default: "dev"
      biometry_branch:
        description: "Branch of tauri-plugin-biometry to use"
        required: false
        default: "main"

jobs:
  build:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch Cargo.toml for CI
        run: |
          RUMAX_BRANCH="${{ github.event.inputs.rumax_branch || 'dev' }}"
          BIOMETRY_BRANCH="${{ github.event.inputs.biometry_branch || 'main' }}"
          sed -i '' "s|path = \"../../rumax\"|git = \"https://github.com/junioraww/rumax.git\", branch = \"$RUMAX_BRANCH\"|g" src-tauri/Cargo.toml
          sed -i '' "s|path = \"../../tauri-plugin-biometry\"|git = \"https://github.com/junioraww/tauri-plugin-biometry.git\", branch = \"$BIOMETRY_BRANCH\"|g" src-tauri/Cargo.toml
          sed -i '' '/libwebrtc/d' src-tauri/Cargo.toml

          echo "Cargo.toml updated for cloud build:"
          grep -E "rumax|tauri-plugin-biometry" src-tauri/Cargo.toml

      - name: Prepare Tauri iOS
        run: bun tauri ios init --ci

      - name: Generate Icons
        run: bun run tauri icon static/favicon.png

      - name: Fix Swift Package dependencies
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml
          find ~/.cargo/registry/src -name "Package.resolved" -delete 2>/dev/null || true

      - name: Build iOS
        run: bun tauri ios build --ci --target aarch64 --no-sign

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: maxplus-ios-unsigned
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error

name: Build Max+ macOS

on:
  workflow_dispatch:
    inputs:
      rumax_branch:
        description: "Branch of rumax to use"
        required: false
        default: "dev"
      biometry_branch:
        description: "Branch of tauri-plugin-biometry to use"
        required: false
        default: "main"

jobs:
  build:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Patch Cargo.toml for CI
        run: |
          RUMAX_BRANCH="${{ github.event.inputs.rumax_branch || 'dev' }}"
          BIOMETRY_BRANCH="${{ github.event.inputs.biometry_branch || 'main' }}"
          sed -i '' "s|path = \"../../rumax\"|git = \"https://github.com/junioraww/rumax.git\", branch = \"$RUMAX_BRANCH\"|g" src-tauri/Cargo.toml
          sed -i '' "s|path = \"../../tauri-plugin-biometry\"|git = \"https://github.com/junioraww/tauri-plugin-biometry.git\", branch = \"$BIOMETRY_BRANCH\"|g" src-tauri/Cargo.toml
          sed -i '' '/libwebrtc/d' src-tauri/Cargo.toml
          grep -E "rumax|tauri-plugin-biometry" src-tauri/Cargo.toml

      - run: bun install --frozen-lockfile

      - run: bun run tauri icon static/favicon.png

      - run: bunx tauri build --target universal-apple-darwin

      - name: Normalize Artifact Names
        run: |
          for f in src-tauri/target/universal-apple-darwin/release/bundle/dmg/MAX*; do
            [ -f "$f" ] && mv "$f" "${f//MAX/maxplus}"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: maxplus-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
